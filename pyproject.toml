[project]
name = "hk-daily-mcp"
version = "0.1.0"
description = "Hong Kong daily-information MCP server: KMB transport, HKO weather, MTR, ferries, tides, holidays, AQHI and news over FastAPI + MCP"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "hk-daily-mcp contributors" }
]
keywords = [
    "hong-kong",
    "mcp",
    "fastapi",
    "kmb",
    "hko",
    "mtr",
    "transit",
    "weather",
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2024",
    "fastapi==0.135.1",
    "geopy==2.4.1",
    "haversine==2.9.0",
    "httpx==0.28.1",
    "mcp>=2,<3",
    "numpy==2.4.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "scipy==1.17.1",
    "uvicorn==0.41.0",
]

[project.urls]
Repository = "https://github.com/chauchauhy/hk-daily-mcp"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4,<5",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Pragmatic safe subset: pyflakes (unused imports/names) + selected pycodestyle.
select = ["E4", "E7", "E9", "F"]

# App repo, not a distributable package: manage deps only, don't build/install it.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: tests that hit live third-party APIs",
]
